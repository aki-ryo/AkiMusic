<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>AkiMusic</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='0.3' y2='1'><stop offset='0' stop-color='%23ff5f6d'/><stop offset='0.45' stop-color='%23fa2d48'/><stop offset='1' stop-color='%23b81632'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23g)'/><path d='M62 26v33a9 9 0 1 1-3-6.7V34l-18 4v25a9 9 0 1 1-3-6.7V32.5z' fill='white'/></svg>" />
<link rel="stylesheet" href="/css/tokens.css" />
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.6 12 4l8 6.6V20a1 1 0 0 1-1 1h-4.6v-6.4H9.6V21H5a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.3 16.3 21 21"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 4v16M9.4 4v16M13.6 5.3l5 14.2"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.6V12l3 1.8"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.3 4.9 13.2a4.6 4.6 0 0 1 6.5-6.5l.6.6.6-.6a4.6 4.6 0 1 1 6.5 6.5z"/></symbol>
    <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M12 20.3 4.9 13.2a4.6 4.6 0 0 1 6.5-6.5l.6.6.6-.6a4.6 4.6 0 1 1 6.5 6.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.3c0-.8.9-1.3 1.6-.9l9.1 6.7c.6.4.6 1.3 0 1.7l-9.1 6.8c-.7.4-1.6 0-1.6-.8z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="7" y="5" width="3.6" height="14" rx="1.4" fill="currentColor" stroke="none"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.4" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6.5 5v14" stroke-width="2.4"/><path d="M19 6.4v11.2c0 .9-1 1.4-1.7.9l-8.2-5.6a1.1 1.1 0 0 1 0-1.8l8.2-5.7c.7-.5 1.7 0 1.7.9z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M17.5 5v14" stroke-width="2.4"/><path d="M5 6.4v11.2c0 .9 1 1.4 1.7.9l8.2-5.6a1.1 1.1 0 0 0 0-1.8L6.7 5.5C6 5 5 5.5 5 6.4z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3.2c1.5 0 2.9.8 3.7 2l3.9 6c.8 1.2 2.2 2 3.7 2H21"/><path d="M3 17h3.2c1.5 0 2.9-.8 3.7-2l.9-1.4"/><path d="m15.2 8.2.9-1.2c.8-1.2 2.2-2 3.7-2H21"/><path d="m18.2 2.3 2.9 2.7-2.9 2.7"/><path d="m18.2 14.8 2.9 2.7-2.9 2.7"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 10.5V9.6A4 4 0 0 1 8 5.6h11.4"/><path d="m17 3.2 2.6 2.4L17 8"/><path d="M20 13.5v.9a4 4 0 0 1-4 4H4.6"/><path d="m7 21 -2.6-2.4L7 16.2"/></symbol>
    <symbol id="i-repeat-one" viewBox="0 0 24 24"><path d="M4 10.5V9.6A4 4 0 0 1 8 5.6h11.4"/><path d="m17 3.2 2.6 2.4L17 8"/><path d="M20 13.5v.9a4 4 0 0 1-4 4H4.6"/><path d="m7 21 -2.6-2.4L7 16.2"/><path d="M11.4 10.6l1.6-1v4.6" stroke-width="1.6"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.8h3l4-3.3v11L7 14.2H4z"/><path d="M15 9.4a3.8 3.8 0 0 1 0 5.2"/><path d="M17.6 6.9a7.3 7.3 0 0 1 0 10.2"/></symbol>
    <symbol id="i-volume-off" viewBox="0 0 24 24"><path d="M4 9.8h3l4-3.3v11L7 14.2H4z"/><path d="m15.4 9.6 4.4 4.4M19.8 9.6l-4.4 4.4"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 7h10M4 12h10M4 17h6"/><path d="M17.5 11.5v7.2"/><path d="m20.6 15.4-3.1-3.1-3.1 3.1"/></symbol>
    <symbol id="i-lyrics" viewBox="0 0 24 24"><path d="M4 6.5h16M4 11.5h11M4 16.5h16M4 20.5h7" stroke-width="1.7"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.5" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 4.5-7.5 7.5L15 19.5"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 4.5 7.5 7.5L9 19.5"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M20 12H4.5"/><path d="m10 5.5-6.5 6.5 6.5 6.5"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h15.5"/><path d="m14 5.5 6.5 6.5-6.5 6.5"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9.2 18.3V6.4l9.6-2v11.4"/><circle cx="6.6" cy="18.4" r="2.6"/><circle cx="16.2" cy="15.7" r="2.6"/></symbol>
    <symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="2.4"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20v-6M11 20V7M17 20v-9M23 20V4" stroke-width="2.2"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="10.5" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.2A8.4 8.4 0 0 1 9.8 4 8.5 8.5 0 1 0 20 14.2z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3.2c.4 4.4 1.7 5.7 6.1 6.1-4.4.4-5.7 1.7-6.1 6.1-.4-4.4-1.7-5.7-6.1-6.1 4.4-.4 5.7-1.7 6.1-6.1z"/><path d="M18.4 15.1c.2 2.1.8 2.7 2.9 2.9-2.1.2-2.7.8-2.9 2.9-.2-2.1-.8-2.7-2.9-2.9 2.1-.2 2.7-.8 2.9-2.9z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 6.5"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.6h5V7M6.5 7l1 13h9l1-13"/></symbol>
    <symbol id="i-logo" viewBox="0 0 32 32"><path d="M4 19.5c2.6-6.4 5.2-6.4 7.8 0s5.2 6.4 7.8 0 5.2-6.4 7.8 0" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><path d="M8 11c2.1-4.6 4.2-4.6 6.3 0s4.2 4.6 6.3 0 4.2-4.6 6.3 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".45"/></symbol>
  </defs>
</svg>

<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg class="icon"><use href="#i-note"/></svg></div>
      <div class="brand-text">
        <span class="brand-name">AkiMusic</span>
        <span class="brand-sub">Liquid Glass · 网易云</span>
      </div>
    </div>

    <nav class="nav" id="navMain">
      <button class="nav-item ripple" data-route="#/home">
        <svg class="icon"><use href="#i-home"/></svg><span>发现</span>
      </button>
      <button class="nav-item ripple" data-route="#/search">
        <svg class="icon"><use href="#i-search"/></svg><span>搜索</span>
      </button>
      <button class="nav-item ripple" data-route="#/charts">
        <svg class="icon"><use href="#i-chart"/></svg><span>排行榜</span>
      </button>
    </nav>

    <div class="nav-label">资料库</div>
    <nav class="nav" id="navLib">
      <button class="nav-item ripple" data-route="#/recent">
        <svg class="icon"><use href="#i-clock"/></svg><span>最近播放</span>
      </button>
      <button class="nav-item ripple" data-route="#/liked">
        <svg class="icon"><use href="#i-heart"/></svg><span>我喜欢的音乐</span>
      </button>
    </nav>

    <div class="nav-label nav-label--row">
      <span>我的歌单</span>
      <button class="mini-btn ripple" id="addPlaylist" title="新建歌单"><svg class="icon"><use href="#i-plus"/></svg></button>
    </div>
    <div class="nav-playlists" id="navPlaylists"></div>

    <div class="sidebar-foot">
      <div class="signal">
        <span class="signal-dot"></span>
        <span id="sourceStatus">网易云音乐 · 在线</span>
      </div>
      <div class="clarity" title="iOS 27 风格的液态玻璃透明度">
        <span>玻璃</span>
        <input type="range" id="clarity" min="0" max="100" value="72" aria-label="玻璃透明度" />
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn ripple menu-btn" id="menuBtn" title="菜单"><svg class="icon"><use href="#i-menu"/></svg></button>
      <div class="hist">
        <button class="icon-btn ripple" id="backBtn" title="后退"><svg class="icon"><use href="#i-chevron-left"/></svg></button>
        <button class="icon-btn ripple" id="fwdBtn" title="前进"><svg class="icon"><use href="#i-chevron-right"/></svg></button>
      </div>
      <div class="topbar-title" id="topbarTitle">发现</div>
      <form class="searchbar" id="searchForm" autocomplete="off">
        <svg class="icon"><use href="#i-search"/></svg>
        <input type="search" id="searchInput" placeholder="搜索歌曲、歌手、专辑" aria-label="搜索" />
        <button type="button" class="searchbar-clear" id="searchClear" hidden><svg class="icon"><use href="#i-close"/></svg></button>
      </form>
      <div class="topbar-actions">
        <button class="icon-btn ripple" id="themeBtn" title="切换主题"><svg class="icon"><use href="#i-sun"/></svg></button>
        <div class="avatar" title="sukiyo">S</div>
      </div>
    </header>

    <div class="scroll" id="scroll">
      <div class="view" id="view"></div>
      <div class="scroll-pad"></div>
    </div>
  </main>

  <footer class="player" id="player">
    <div class="player-left">
      <button class="player-art ripple" id="npOpen" title="打开播放页">
        <div class="player-art-ph"><svg class="icon"><use href="#i-note"/></svg></div>
        <img id="pArt" alt="" hidden />
        <div class="player-art-glow"></div>
      </button>
      <div class="player-meta">
        <div class="player-title" id="pTitle">还没有播放音乐</div>
        <div class="player-sub" id="pArtist">从「发现」挑一首吧</div>
      </div>
      <button class="icon-btn ripple like-btn" id="pLike" title="喜欢"><svg class="icon"><use href="#i-heart"/></svg></button>
    </div>

    <div class="player-center">
      <div class="controls">
        <button class="icon-btn ripple" id="pShuffle" title="随机播放"><svg class="icon"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn ripple" id="pPrev" title="上一首"><svg class="icon"><use href="#i-prev"/></svg></button>
        <button class="play-btn ripple" id="pPlay" title="播放"><svg class="icon"><use href="#i-play"/></svg></button>
        <button class="icon-btn ripple" id="pNext" title="下一首"><svg class="icon"><use href="#i-next"/></svg></button>
        <button class="icon-btn ripple" id="pRepeat" title="循环模式"><svg class="icon"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="timeline">
        <span class="time" id="pCur">0:00</span>
        <div class="slider" id="pSlider" role="slider" tabindex="0" aria-label="播放进度">
          <div class="slider-track"><div class="slider-fill" id="pFill"></div><div class="slider-thumb" id="pThumb"></div></div>
        </div>
        <span class="time" id="pDur">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <button class="icon-btn ripple play-mini" id="mPlay" title="播放"><svg class="icon"><use href="#i-play"/></svg></button>
      <button class="icon-btn ripple" id="pLyrics" title="歌词"><svg class="icon"><use href="#i-lyrics"/></svg></button>
      <button class="icon-btn ripple" id="pQueue" title="播放队列"><svg class="icon"><use href="#i-queue"/></svg></button>
      <div class="volume">
        <button class="icon-btn ripple" id="pMute" title="静音"><svg class="icon"><use href="#i-volume"/></svg></button>
        <div class="slider slider--vol" id="vSlider" role="slider" tabindex="0" aria-label="音量">
          <div class="slider-track"><div class="slider-fill" id="vFill"></div><div class="slider-thumb"></div></div>
        </div>
      </div>
    </div>
  </footer>
</div>

<section class="np" id="np" aria-hidden="true">
  <div class="np-bg"><img id="npBg" alt="" /><div class="np-bg-scrim"></div></div>
  <div class="np-inner">
    <header class="np-top">
      <button class="icon-btn ripple" id="npClose" title="收起"><svg class="icon"><use href="#i-chevron-down"/></svg></button>
      <div class="np-top-mid">
        <span class="np-kicker">正在播放</span>
        <span class="np-source" id="npSource">网易云音乐</span>
      </div>
      <button class="icon-btn ripple" id="npQueueBtn" title="队列"><svg class="icon"><use href="#i-queue"/></svg></button>
    </header>

    <div class="np-body">
      <div class="np-stage">
        <div class="np-vinyl"><div class="np-vinyl-disc"></div></div>
        <div class="np-art" id="npArtWrap">
          <img id="npArt" alt="" />
          <div class="np-art-shine"></div>
        </div>
        <div class="np-meta">
          <h1 class="np-title" id="npTitle">未在播放</h1>
          <div class="np-artist" id="npArtist">—</div>
          <div class="np-album" id="npAlbum"></div>
          <div class="np-actions">
            <button class="icon-btn ripple like-btn" id="npLike"><svg class="icon"><use href="#i-heart"/></svg></button>
            <button class="icon-btn ripple" id="npMore"><svg class="icon"><use href="#i-more"/></svg></button>
          </div>
        </div>
      </div>

      <div class="np-panel">
        <div class="np-tabs" id="npTabs">
          <button class="seg ripple is-on" data-tab="lyrics">歌词</button>
          <button class="seg ripple" data-tab="queue">播放队列</button>
        </div>
        <div class="np-lyrics" id="npLyrics"><div class="lyr-empty">播放一首歌，让歌词浮上来。</div></div>
        <div class="np-queue" id="npQueue" hidden></div>
      </div>
    </div>

    <footer class="np-controls">
      <div class="np-timeline">
        <span class="time" id="npCur">0:00</span>
        <div class="slider slider--lg" id="npSlider">
          <div class="slider-track"><div class="slider-fill" id="npFill"></div><div class="slider-thumb"></div></div>
        </div>
        <span class="time" id="npDur">0:00</span>
      </div>
      <div class="np-buttons">
        <button class="icon-btn ripple" id="npShuffle"><svg class="icon"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn ripple" id="npPrev"><svg class="icon"><use href="#i-prev"/></svg></button>
        <button class="np-play ripple" id="npPlay"><svg class="icon"><use href="#i-play"/></svg></button>
        <button class="icon-btn ripple" id="npNext"><svg class="icon"><use href="#i-next"/></svg></button>
        <button class="icon-btn ripple" id="npRepeat"><svg class="icon"><use href="#i-repeat"/></svg></button>
      </div>
    </footer>
  </div>
</section>

<div class="sheet-scrim" id="sheetScrim" hidden></div>
<aside class="queue-sheet" id="queueSheet" aria-hidden="true">
  <header class="qs-head">
    <div>
      <div class="qs-kicker">播放队列</div>
      <div class="qs-count" id="qsCount">0 首</div>
    </div>
    <button class="icon-btn ripple" id="qsClose"><svg class="icon"><use href="#i-close"/></svg></button>
  </header>
  <div class="qs-list" id="qsList"></div>
</aside>

<nav class="tabbar" id="tabbar" aria-label="主导航">
  <div class="tabbar-inner">
    <button class="nav-item ripple" data-route="#/home">
      <svg class="icon"><use href="#i-home"/></svg><span>首页</span>
    </button>
    <button class="nav-item ripple" data-route="#/charts">
      <svg class="icon"><use href="#i-chart"/></svg><span>排行榜</span>
    </button>
    <button class="nav-item ripple" data-route="#/search">
      <svg class="icon"><use href="#i-search"/></svg><span>搜索</span>
    </button>
    <button class="nav-item ripple" data-route="#/liked">
      <svg class="icon"><use href="#i-library"/></svg><span>资料库</span>
    </button>
  </div>
</nav>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
