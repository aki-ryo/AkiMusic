name: iOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project AkiMusic.xcodeproj \
            -scheme AkiMusic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | tail -n 60

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AkiMusic.app Payload/
          zip -qry AkiMusic-0.1.1-beta-unsigned.ipa Payload
          ls -lh AkiMusic-0.1.1-beta-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AkiMusic-ipa
          path: ios/AkiMusic-0.1.1-beta-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        working-directory: ios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v0.1.1-beta >/dev/null 2>&1; then
            gh release create v0.1.1-beta \
              --title "AkiMusic 0.1.1 beta" \
              --notes "未签名 iOS 构建，需要 Sideloadly / AltStore 侧载安装。" \
              --target "$GITHUB_SHA"
          fi
          gh release upload v0.1.1-beta AkiMusic-0.1.1-beta-unsigned.ipa --clobber
